<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mental Skills Check</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#16211A;
    --panel:#1E2E24;
    --panel-2:#233427;
    --chalk:#F3F1E8;
    --sage:#93A79A;
    --accent:#E8B826;
    --low:#C0503A;
    --mid:#E8B826;
    --high:#6FA37A;
    --line: rgba(243,241,232,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .shell{max-width:640px; margin:0 auto;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
    font-size:clamp(28px,6vw,40px);
    line-height:1.05;
  }
  h2{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.02em;
    font-size:22px;
  }
  p.lede{color:var(--sage); margin-top:10px; font-size:15px; line-height:1.5;}
  .header-rule{
    height:1px;
    margin:20px 0 28px;
    background-image: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 18px);
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:24px;
  }
  .notice{
    background:var(--panel-2);
    border:1px solid var(--accent);
    border-radius:8px;
    padding:14px 16px;
    font-size:13px;
    color:var(--chalk);
    margin-bottom:20px;
    line-height:1.5;
  }
  .notice strong{color:var(--accent);}
  label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--sage);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--chalk);
    padding:12px 14px;
    font-size:15px;
    font-family:'IBM Plex Sans', sans-serif;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  .field{margin-bottom:18px;}
  .btn{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:13px;
    font-weight:500;
    background:var(--accent);
    color:#1B2416;
    border:none;
    padding:14px 22px;
    border-radius:6px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:0.35; cursor:not-allowed; transform:none;}
  .btn-ghost{
    background:transparent;
    color:var(--sage);
    border:1px solid var(--line);
  }
  .row{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:24px;}
  .link{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--sage);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
  }
  .link:hover{color:var(--accent);}

  .ring-wrap{position:relative; width:64px; height:64px; flex:none;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--line); stroke-width:5;}
  .ring-fill{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .3s ease;}
  .ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--chalk);
  }
  .section-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px;}
  .domain-name{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}

  .item{margin-bottom:28px;}
  .item:last-child{margin-bottom:4px;}
  .item p{font-size:15.5px; line-height:1.45; margin-bottom:14px;}
  .scale{display:flex; gap:8px;}
  .disc{
    width:44px; height:44px;
    border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    color:var(--sage);
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .12s ease;
  }
  .disc:hover{border-color:var(--accent); color:var(--chalk);}
  .disc.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#1B2416;
    font-weight:600;
    transform:scale(1.06);
  }
  .scale-labels{display:flex; justify-content:space-between; margin-top:6px;}
  .scale-labels span{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--sage); text-transform:uppercase; letter-spacing:0.05em;}

  .bar-row{margin-bottom:16px;}
  .bar-head{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px;}
  .bar-head .score{font-family:'IBM Plex Mono', monospace;}
  .bar-track{height:10px; border-radius:5px; background:var(--bg); border:1px solid var(--line); overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px;}
  .tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
    padding:2px 8px; border-radius:20px; margin-left:8px;
  }

  table{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:12px;}
  th, td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line);}
  th{font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--sage); font-weight:500;}
  tr:hover td{background:var(--panel-2);}
  .view-btn{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--accent); background:none; border:1px solid var(--line); border-radius:5px; padding:5px 10px; cursor:pointer;}
  .view-btn:hover{border-color:var(--accent);}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,15,11,0.72);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{max-width:520px; width:100%; max-height:85vh; overflow:auto;}

  .empty{color:var(--sage); font-size:14px; padding:24px 0; text-align:center;}
  .footer-note{margin-top:36px; text-align:center; color:var(--sage); font-size:11.5px; font-family:'IBM Plex Mono', monospace;}
  .spinner-text{color:var(--sage); font-size:13px; font-family:'IBM Plex Mono', monospace;}
  @media (max-width:420px){
    .disc{width:38px; height:38px; font-size:13px;}
    .scale{gap:6px;}
  }

  @media print{
    :root{
      --bg:#ffffff;
      --panel:#ffffff;
      --panel-2:#f5f5f5;
      --chalk:#111111;
      --sage:#555555;
      --line:#cccccc;
    }
    body{padding:0;}
    .no-print{display:none !important;}
    .modal-backdrop{position:static; background:#fff; padding:0; display:block;}
    .modal{max-height:none; max-width:none; overflow:visible;}
    .panel{border:1px solid #ccc; box-shadow:none;}
    .disc{border-color:#ccc;}
  }
</style>
</head>
<body>
<div class="shell" id="app"></div>

<script>
/* ================= CONFIG ================= */
// Paste the Google Apps Script "Web app URL" here after you deploy it.
// See AppsScript_Code.gs for setup steps.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykURB_LPPhVb1MgysgNNIUChlsOu1XGHEsIR6VPvPAIGfHSk1SMVH6gPoqPYWHoNuc/exec";

/* ================= DATA ================= */
const DOMAINS = [
  { key:"confidence", name:"Self-Confidence", items:[
    "I believe I can perform well even against tougher opponents.",
    "I trust my preparation and my ability in competition.",
    "I recover my belief in myself quickly after a bad play or result."
  ]},
  { key:"focus", name:"Focus & Concentration", items:[
    "I can hold my focus on the task even with distractions around me.",
    "I stay present rather than replaying past mistakes while competing.",
    "My mind doesn't wander to unrelated things during competition."
  ]},
  { key:"pressure", name:"Managing Pressure & Anxiety", items:[
    "I stay calm and in control during high-pressure moments.",
    "Nervousness before competition doesn't hurt my performance.",
    "I can settle my breathing and physical tension when I'm stressed."
  ]},
  { key:"motivation", name:"Motivation & Commitment", items:[
    "I put in extra effort in training even when it's hard.",
    "I stay motivated through difficult stretches of a season.",
    "I push myself to improve, not just to avoid failing."
  ]},
  { key:"goals", name:"Goal Setting", items:[
    "I set specific, measurable goals for training and competition.",
    "I track my progress toward my goals regularly.",
    "I adjust my goals or plans when circumstances change."
  ]},
  { key:"prep", name:"Mental Preparation & Imagery", items:[
    "I mentally rehearse or visualize my performance before competing.",
    "I have a consistent routine before I compete.",
    "I prepare mentally, not just physically, before competition."
  ]},
  { key:"composure", name:"Composure & Resilience", items:[
    "I bounce back quickly after making a mistake in competition.",
    "I stay composed when things aren't going my way.",
    "Setbacks make me more determined rather than discouraged."
  ]},
  { key:"coachability", name:"Coachability & Team Focus", items:[
    "I respond well to feedback, even when it's critical.",
    "I put team or group goals ahead of personal recognition when it matters.",
    "I communicate well with teammates and coaches."
  ]}
];

const DOMAIN_HEADER_MAP = {
  confidence:"Confidence", focus:"Focus", pressure:"Pressure", motivation:"Motivation",
  goals:"Goals", prep:"Mental Prep", composure:"Composure", coachability:"Coachability"
};

/* ================= STATE ================= */
let state = {
  view: "intro",
  name: "",
  sport: "",
  sectionIndex: 0,
  answers: {},
  lastSubmission: null,
  coachData: null,
  coachPasscode: null
};

function itemId(domainKey, i){ return domainKey + "_" + i; }

/* ================= SCORING ================= */
function scoreSubmission(answers){
  const domainScores = {};
  let allVals = [];
  DOMAINS.forEach(d=>{
    let vals = d.items.map((_,i)=>answers[itemId(d.key,i)]).filter(v=>typeof v==="number");
    let avg = vals.reduce((a,b)=>a+b,0)/vals.length;
    domainScores[d.key] = avg;
    allVals = allVals.concat(vals);
  });
  const overall = allVals.reduce((a,b)=>a+b,0)/allVals.length;
  return { domainScores, overall };
}

function bandFor(score){
  if(score < 2.5) return {label:"Growth Area", color:"var(--low)"};
  if(score < 3.75) return {label:"Developing", color:"var(--mid)"};
  return {label:"Strength", color:"var(--high)"};
}

function isConfigured(){
  return SCRIPT_URL && SCRIPT_URL.indexOf("PASTE_YOUR") !== 0;
}

/* ================= BACKEND (Google Apps Script) ================= */
async function saveSubmission(sub){
  try{
    await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
      body: JSON.stringify(sub)
    });
    return true;
  }catch(e){
    console.error("save failed", e);
    return false;
  }
}

async function loadAllSubmissions(passcode){
  try{
    const res = await fetch(SCRIPT_URL + "?action=list&passcode=" + encodeURIComponent(passcode));
    const json = await res.json();
    if(json.status !== "ok") return { ok:false, data:[] };
    const subs = json.data.map(rowToSubmission);
    subs.sort((a,b)=> b.submittedAt - a.submittedAt);
    return { ok:true, data: subs };
  }catch(e){
    console.error("list failed", e);
    return { ok:false, data:[] };
  }
}

function rowToSubmission(row){
  const domainScores = {};
  DOMAINS.forEach(d=>{
    domainScores[d.key] = parseFloat(row[DOMAIN_HEADER_MAP[d.key]]);
  });
  let answers = {};
  try{ answers = JSON.parse(row["AnswersJSON"]); }catch(e){}
  const ts = row["Timestamp"] ? new Date(row["Timestamp"]).getTime() : Date.now();
  return {
    id: ts + "_" + (row["Name"]||""),
    name: row["Name"] || "",
    sport: row["Sport"] || "",
    submittedAt: ts,
    overall: parseFloat(row["Overall"]),
    domainScores,
    answers
  };
}

/* ================= RENDER ================= */
const app = document.getElementById("app");

function render(){
  if(state.view==="intro") return renderIntro();
  if(state.view==="assessment") return renderAssessment();
  if(state.view==="results") return renderResults();
  if(state.view==="coachGate") return renderCoachGate();
  if(state.view==="coach") return renderCoach();
}

function configNotice(){
  if(isConfigured()) return "";
  return `<div class="notice"><strong>Setup needed:</strong> open this HTML file in a text editor and set <code>SCRIPT_URL</code> to your deployed Google Apps Script web app URL. See AppsScript_Code.gs for steps.</div>`;
}

function renderIntro(){
  app.innerHTML = `
    <div class="eyebrow">Mental Skills Check-in</div>
    <h1>Know Your Game<br/>Between the Ears</h1>
    <p class="lede">24 quick statements across 8 areas of mental performance. Answer honestly &mdash; there's no right answer, just where you are right now. Takes about 5 minutes.</p>
    <div class="header-rule"></div>
    ${configNotice()}
    <div class="panel">
      <div class="field">
        <label for="nameInput">Your Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Sam Rivera" value="${escapeAttr(state.name)}"/>
      </div>
      <div class="field">
        <label for="sportInput">Sport <span style="opacity:.6">(optional)</span></label>
        <input type="text" id="sportInput" placeholder="e.g. Soccer, Track, Swimming" value="${escapeAttr(state.sport)}"/>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn" id="beginBtn">Begin Assessment</button>
        <button class="link" id="coachLink">Coach dashboard &rarr;</button>
      </div>
    </div>
    <div class="footer-note">Responses are saved to your Google Sheet so you can track athletes over time.</div>
  `;
  document.getElementById("nameInput").addEventListener("input", e=> state.name = e.target.value);
  document.getElementById("sportInput").addEventListener("input", e=> state.sport = e.target.value);
  document.getElementById("beginBtn").addEventListener("click", ()=>{
    if(!state.name.trim()){
      document.getElementById("nameInput").style.borderColor = "var(--low)";
      return;
    }
    state.view = "assessment";
    state.sectionIndex = 0;
    render();
  });
  document.getElementById("coachLink").addEventListener("click", ()=>{
    state.view = "coachGate";
    render();
  });
}

function ringSVG(fraction, labelText){
  const r = 27, c = 2*Math.PI*r;
  const offset = c * (1-fraction);
  return `
    <div class="ring-wrap">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle class="ring-track" cx="32" cy="32" r="${r}"></circle>
        <circle class="ring-fill" cx="32" cy="32" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="ring-label">${labelText}</div>
    </div>
  `;
}

function renderAssessment(){
  const d = DOMAINS[state.sectionIndex];
  const fraction = (state.sectionIndex) / DOMAINS.length;
  app.innerHTML = `
    <div class="section-top">
      <div>
        <div class="eyebrow">Section ${state.sectionIndex+1} of ${DOMAINS.length}</div>
        <h2>${d.name}</h2>
      </div>
      ${ringSVG(fraction, (state.sectionIndex+1)+"/"+DOMAINS.length)}
    </div>
    <div class="panel">
      ${d.items.map((text,i)=>{
        const id = itemId(d.key,i);
        const val = state.answers[id];
        return `
          <div class="item">
            <p>${text}</p>
            <div class="scale">
              ${[1,2,3,4,5].map(n=>`<button class="disc ${val===n?'selected':''}" data-id="${id}" data-val="${n}">${n}</button>`).join("")}
            </div>
            <div class="scale-labels">
              <span>Strongly Disagree</span>
              <span>Strongly Agree</span>
            </div>
          </div>
        `;
      }).join("")}
      <div class="row">
        <button class="btn btn-ghost" id="backBtn" ${state.sectionIndex===0 ? "disabled":""}>Back</button>
        <button class="btn" id="nextBtn">${state.sectionIndex === DOMAINS.length-1 ? "Finish" : "Next Section"}</button>
      </div>
    </div>
  `;
  app.querySelectorAll(".disc").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.answers[btn.dataset.id] = parseInt(btn.dataset.val,10);
      render();
    });
  });
  document.getElementById("backBtn").addEventListener("click", ()=>{
    if(state.sectionIndex>0){ state.sectionIndex--; render(); }
  });
  document.getElementById("nextBtn").addEventListener("click", async ()=>{
    const allAnswered = d.items.every((_,i)=> typeof state.answers[itemId(d.key,i)]==="number");
    if(!allAnswered) return;
    if(state.sectionIndex === DOMAINS.length-1){
      await finishAssessment();
    } else {
      state.sectionIndex++;
      render();
    }
  });
  updateNextButtonState(d);
}

function updateNextButtonState(d){
  const allAnswered = d.items.every((_,i)=> typeof state.answers[itemId(d.key,i)]==="number");
  const btn = document.getElementById("nextBtn");
  if(btn) btn.disabled = !allAnswered;
}

async function finishAssessment(){
  const scored = scoreSubmission(state.answers);
  const sub = {
    name: state.name.trim(),
    sport: state.sport.trim(),
    submittedAt: Date.now(),
    answers: state.answers,
    domainScores: scored.domainScores,
    overall: scored.overall
  };
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn){ nextBtn.disabled = true; nextBtn.textContent = "Saving..."; }
  await saveSubmission(sub);
  state.lastSubmission = sub;
  state.view = "results";
  render();
}

function renderBarRows(domainScores){
  return DOMAINS.map(d=>{
    const score = domainScores[d.key];
    const band = bandFor(score);
    return `
      <div class="bar-row">
        <div class="bar-head">
          <span>${d.name}</span>
          <span class="score">${score.toFixed(1)}<span class="tag" style="background:${band.color}22; color:${band.color};">${band.label}</span></span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${(score/5*100).toFixed(0)}%; background:${band.color};"></div></div>
      </div>
    `;
  }).join("");
}

function renderResults(){
  const sub = state.lastSubmission;
  const overallBand = bandFor(sub.overall);
  app.innerHTML = `
    <div class="eyebrow">Assessment Complete</div>
    <h1>${(sub.name.split(" ")[0])||"Athlete"}'s Mental Skills</h1>
    <p class="lede">Overall score: <strong style="color:${overallBand.color}; font-family:'IBM Plex Mono', monospace;">${sub.overall.toFixed(1)} / 5</strong> &mdash; ${overallBand.label}. This isn't a grade, it's a map of where to focus.</p>
    <div class="header-rule"></div>
    <div class="panel">
      ${renderBarRows(sub.domainScores)}
      <div class="row no-print">
        <button class="btn btn-ghost" id="printBtn">Print Results</button>
      </div>
    </div>
    <div class="footer-note">Saved. Your coach can see this in the team dashboard.</div>
  `;
  document.getElementById("printBtn").addEventListener("click", ()=> window.print());
}

function renderCoachGate(){
  app.innerHTML = `
    <div class="eyebrow">Coach Access</div>
    <h1>Team Dashboard</h1>
    <p class="lede">Enter the coach passcode to view team results.</p>
    <div class="header-rule"></div>
    ${configNotice()}
    <div class="panel">
      <div class="field">
        <label for="passInput">Passcode</label>
        <input type="text" id="passInput" placeholder="Enter passcode"/>
      </div>
      <div class="row">
        <button class="btn btn-ghost" id="backToIntro">&larr; Back</button>
        <button class="btn" id="enterBtn">Enter</button>
      </div>
      <p id="gateError" style="color:var(--low); font-size:13px; margin-top:12px; display:none;">Incorrect passcode, or couldn't reach the sheet.</p>
    </div>
  `;
  document.getElementById("backToIntro").addEventListener("click", ()=>{ state.view="intro"; render(); });
  const tryEnter = async ()=>{
    const val = document.getElementById("passInput").value;
    const enterBtn = document.getElementById("enterBtn");
    enterBtn.disabled = true; enterBtn.textContent = "Checking...";
    const result = await loadAllSubmissions(val);
    if(result.ok){
      state.coachPasscode = val;
      state.coachData = result.data;
      state.view = "coach";
      render();
    } else {
      enterBtn.disabled = false; enterBtn.textContent = "Enter";
      document.getElementById("gateError").style.display = "block";
    }
  };
  document.getElementById("enterBtn").addEventListener("click", tryEnter);
  document.getElementById("passInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryEnter(); });
}

async function renderCoach(){
  const subs = state.coachData || [];

  let teamAvgHtml = `<div class="empty">No responses yet. Share the link with your athletes.</div>`;
  if(subs.length){
    const domainAgg = {};
    DOMAINS.forEach(d=>{
      const vals = subs.map(s=>s.domainScores[d.key]).filter(v=>typeof v==="number" && !isNaN(v));
      domainAgg[d.key] = vals.reduce((a,b)=>a+b,0)/vals.length;
    });
    teamAvgHtml = renderBarRows(domainAgg);
  }

  const rowsHtml = subs.length ? subs.map(s=>{
    const band = bandFor(s.overall);
    return `
      <tr>
        <td>${escapeHtml(s.name)}</td>
        <td>${escapeHtml(s.sport)||"&mdash;"}</td>
        <td>${new Date(s.submittedAt).toLocaleDateString()}</td>
        <td class="score" style="font-family:'IBM Plex Mono', monospace; color:${band.color};">${s.overall.toFixed(1)}</td>
        <td><button class="view-btn" data-id="${s.id}">View</button></td>
      </tr>
    `;
  }).join("") : "";

  app.innerHTML = `
    <div class="eyebrow">Coach Dashboard</div>
    <div class="row" style="margin-top:0; justify-content:space-between;">
      <h1>Team Results</h1>
      <button class="link" id="refreshBtn">Refresh</button>
    </div>
    <p class="lede">${subs.length} response${subs.length===1?"":"s"} collected. Full history also lives in your Google Sheet.</p>
    <div class="header-rule"></div>

    <h2 style="margin-bottom:14px;">Team Averages</h2>
    <div class="panel" style="margin-bottom:28px;">
      ${teamAvgHtml}
    </div>

    <h2 style="margin-bottom:14px;">Individual Responses</h2>
    <div class="panel">
      ${subs.length ? `
      <table>
        <thead><tr><th>Name</th><th>Sport</th><th>Date</th><th>Overall</th><th></th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="row">
        <button class="btn btn-ghost" id="exportBtn">Export CSV</button>
        <button class="link" id="backToIntro2">&larr; Back to form</button>
      </div>
      ` : `<div class="empty">Nothing here yet.</div><div class="row" style="justify-content:flex-end;"><button class="link" id="backToIntro2">&larr; Back to form</button></div>`}
    </div>
    <div class="footer-note">Data lives in your own Google Sheet — export, chart, or track trends there anytime.</div>
  `;

  document.getElementById("refreshBtn").addEventListener("click", async ()=>{
    const result = await loadAllSubmissions(state.coachPasscode);
    if(result.ok){ state.coachData = result.data; }
    render();
  });
  document.getElementById("backToIntro2").addEventListener("click", ()=>{ state.view="intro"; render(); });
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.addEventListener("click", ()=> exportCSV(subs));
  app.querySelectorAll(".view-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const sub = subs.find(s=>s.id===btn.dataset.id);
      openDetailModal(sub);
    });
  });
}

function scoreColor(n){
  if(n <= 2) return "var(--low)";
  if(n === 3) return "var(--mid)";
  return "var(--high)";
}

function renderAnswerDetail(sub){
  return DOMAINS.map(d=>{
    const itemsHtml = d.items.map((text,i)=>{
      const val = sub.answers[itemId(d.key,i)];
      const shown = (typeof val === "number") ? val : "&mdash;";
      const color = (typeof val === "number") ? scoreColor(val) : "var(--sage)";
      return `
        <div style="display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid var(--line);">
          <span style="font-size:13.5px; line-height:1.4;">${escapeHtml(text)}</span>
          <span style="flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; color:#1B2416; background:${color};">${shown}</span>
        </div>
      `;
    }).join("");
    return `
      <div style="margin-bottom:18px;">
        <div class="domain-name" style="margin-bottom:2px;">${d.name}</div>
        ${itemsHtml}
      </div>
    `;
  }).join("");
}

function openDetailModal(sub){
  const band = bandFor(sub.overall);
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="panel modal">
      <div class="eyebrow">Individual Result</div>
      <h2 style="margin-bottom:4px;">${escapeHtml(sub.name)}</h2>
      <p class="lede" style="margin-bottom:18px;">${escapeHtml(sub.sport)||"No sport listed"} &middot; ${new Date(sub.submittedAt).toLocaleDateString()} &middot; Overall <strong style="color:${band.color};">${sub.overall.toFixed(1)}</strong></p>
      ${renderBarRows(sub.domainScores)}
      <div class="header-rule"></div>
      <h2 style="margin-bottom:14px;">Question-by-Question</h2>
      ${renderAnswerDetail(sub)}
      <div class="row no-print">
        <button class="btn btn-ghost" id="printModalBtn">Print</button>
        <button class="btn btn-ghost" id="closeModal">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click", e=>{ if(e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector("#closeModal").addEventListener("click", ()=> backdrop.remove());
  backdrop.querySelector("#printModalBtn").addEventListener("click", ()=> window.print());
}

function exportCSV(subs){
  const headers = ["Name","Sport","Date","Overall", ...DOMAINS.map(d=>d.name)];
  const rows = subs.map(s=>[
    s.name, s.sport, new Date(s.submittedAt).toLocaleDateString(), s.overall.toFixed(2),
    ...DOMAINS.map(d=> (s.domainScores[d.key]||0).toFixed(2))
  ]);
  const csv = [headers, ...rows].map(r=> r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "mental_skills_results.csv";
  a.click();
  URL.revokeObjectURL(url);
}

/* ================= UTIL ================= */
function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

render();
</script>
</body>
</html>
